name: Build

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: JAR derle
        run: mvn --batch-mode --no-transfer-progress clean package

      - name: JAR dosyasını sakla
        uses: actions/upload-artifact@v4
        with:
          name: KiraziumPetKeys-1.0.0
          path: target/KiraziumPetKeys-1.0.0.jar
          if-no-files-found: error
